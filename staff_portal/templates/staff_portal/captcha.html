{% if captcha_simulated %}
<details class="captcha-preview"><summary>Local verification simulator</summary><label for="captcha">Test verification result</label><select name="captcha" id="captcha"><option value="pass">Pass verification</option><option value="fail">Fail verification</option></select><p class="help">Preview only. Real bot protection is required before launch.</p></details>
{% else %}
<div class="captcha-block">
  <div data-turnstile data-sitekey="{{ turnstile_site_key }}" data-action="{{ captcha_action }}"></div>
  <p id="captcha-status" class="help" role="status" aria-live="polite" tabindex="-1">Please wait for the security check before continuing.</p>
  <button type="button" class="text-button" data-captcha-retry hidden>Try verification again</button>
  <a href="{{ request.path }}" data-captcha-reload hidden>Reload this page</a>
</div>
<noscript><p>Verification requires JavaScript. Contact your administrator if you need help signing in.</p></noscript>
{% endif %}
