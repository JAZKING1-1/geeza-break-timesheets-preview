<section class="work-date-picker no-print" aria-labelledby="work-date-heading">
  <div><h2 id="work-date-heading">{% if sheet %}Choose a work date{% else %}Record your work{% endif %}</h2><p id="work-date-help">Choose the day, month and year you worked. We’ll open the correct monthly timesheet.{% if sheet %} Save any changes below before opening another date.{% endif %}</p></div>
  <form method="post" action="{% url 'staff:new_sheet' %}">
    {% csrf_token %}<label for="id_work_date">Date worked</label>
    <div class="work-date-actions"><input type="date" id="id_work_date" name="work_date" value="{{ work_date_form.work_date.value|date:'Y-m-d' }}" aria-describedby="work-date-help" required>
      <button type="button" class="button secondary" data-calendar-for="id_work_date" hidden>Choose date <span aria-hidden="true">▦</span></button>
      <button type="submit" class="button primary" data-pending-label="Opening timesheet…">Open timesheet <span aria-hidden="true">→</span></button>
    </div>
  </form>
</section>
